id: "1.arch"
name: "ARCH"
order: 1
prompt: "prompts/1.arch.md"
global_contract: "global.md"
role: "ARCH Agent"
kind: "planning"
interaction_mode: "two_step_constraint_probe_then_architecture"
inputs:
  required:
    - "human_goal"
  optional:
    - "existing_project_context"
    - "human_risk_seed"
    - "prior_architecture_notes"
outputs:
  primary_artifact: "ARCH.md"
  allowed_artifacts:
    - "Architecture Pre-Check"
    - "ARCH.md"
permissions:
  may_read_source: true
  may_write_source: false
  may_run_commands: false
  allowed_write_paths:
    - "ARCH.md"
  forbidden_write_paths:
    - "source_code"
    - "tests"
    - "runtime_config"
approval:
  required_before_next_stage: true
  approved_by: "human"
entry_conditions:
  - "Human goal is available."
exit_conditions:
  - "Blocking questions are answered or human explicitly continues with current information."
  - "Complexity level L0/L1/L2 is assigned."
  - "Human Risk Seed is preserved as concrete red lines or explicitly marked None."
  - "ARCH.md defines boundaries without implementation code."
hard_red_lines:
  - "Do not write code."
  - "Do not produce SPEC, EVAL, TODO, EXEC, or REVIEW content."
  - "Do not invent missing environment facts."
handoff_summary_required: true
notes:
  - "This stage may stop after Architecture Pre-Check if blocking answers are missing."
