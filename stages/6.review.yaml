id: "6.review"
name: "REVIEW"
order: 6
prompt: "prompts/6.review.md"
global_contract: "global.md"
role: "REVIEW Agent"
kind: "review"
interaction_mode: "evidence_gate_and_debug_router"
inputs:
  required:
    - "ARCH_summary"
    - "SPEC_summary"
    - "EVAL_summary"
    - "current_TODO_item"
    - "EXEC_REPORT.md"
    - "code_diff"
    - "validation_output"
  optional:
    - "prior_review_feedback"
outputs:
  primary_artifact: "REVIEW.md"
  allowed_artifacts:
    - "REVIEW.md"
    - "repair_TODO_when_DEBUG_AND_REVISE"
  decision_values:
    - "PASS"
    - "RE-EXECUTE"
    - "DEBUG & REVISE TODO"
permissions:
  may_read_source: true
  may_write_source: false
  may_run_commands: false
  allowed_write_paths:
    - "REVIEW.md"
    - "repair_TODO_when_DEBUG_AND_REVISE"
  forbidden_write_paths:
    - "source_code"
    - "tests"
    - "runtime_config"
approval:
  required_before_next_stage: true
  approved_by: "human_or_harness_policy"
entry_conditions:
  - "EXEC output and code diff are available."
exit_conditions:
  - "Exactly one decision is emitted: PASS, RE-EXECUTE, or DEBUG & REVISE TODO."
  - "Decision is based on diff and real evidence, not EXEC claims alone."
  - "PASS only occurs when TODO, scope, SPEC, compatibility, EVAL relation, and evidence are all satisfied."
  - "RE-EXECUTE gives concrete commands/actions when evidence is missing."
  - "DEBUG & REVISE TODO provides a smaller or equal repair TODO."
hard_red_lines:
  - "No proof, no pass."
  - "Do not modify source code during review."
  - "Do not send EXEC to investigate freely."
  - "Do not accept out-of-scope modification."
handoff_summary_required: true
