id: "2.spec"
name: "SPEC"
order: 2
prompt: "prompts/2.spec.md"
global_contract: "global.md"
role: "SPEC Agent"
kind: "contract"
interaction_mode: "single_pass_from_approved_arch"
inputs:
  required:
    - "approved_ARCH.md"
  optional:
    - "human_risk_seed"
    - "relevant_existing_code_context"
outputs:
  primary_artifact: "SPEC.md"
  allowed_artifacts:
    - "SPEC.md"
permissions:
  may_read_source: true
  may_write_source: false
  may_run_commands: false
  allowed_write_paths:
    - "SPEC.md"
  forbidden_write_paths:
    - "source_code"
    - "tests"
    - "runtime_config"
approval:
  required_before_next_stage: true
  approved_by: "human"
entry_conditions:
  - "ARCH.md is approved by human."
exit_conditions:
  - "SPEC.md inherits complexity level from ARCH.md."
  - "SPEC.md preserves all architecture red lines and compatibility constraints."
  - "State, contracts, flow, errors, and code-level red lines are defined only as needed."
  - "Unknown non-blocking details are marked as assumptions."
hard_red_lines:
  - "Do not write full implementation code."
  - "Do not create future-proof abstractions unused by this round."
  - "Do not alter architecture decisions."
handoff_summary_required: true
