id: "4.todo"
name: "TODO"
order: 4
prompt: "prompts/4.todo.md"
global_contract: "global.md"
role: "TODO Agent"
kind: "work_package"
interaction_mode: "construction_boundary_split"
inputs:
  required:
    - "approved_ARCH.md"
  conditional:
    - "approved_SPEC.md required for L1/L2 or when SPEC was generated."
    - "approved_EVAL.md required for L1/L2 or when EVAL was generated."
  optional:
    - "approved_SPEC.md for L0 when available"
    - "approved_EVAL.md for L0 when available"
    - "current_repository_context"
outputs:
  primary_artifact: "TODO.md"
  allowed_artifacts:
    - "TODO.md"
permissions:
  may_read_source: true
  may_write_source: false
  may_run_commands: false
  allowed_write_paths:
    - "TODO.md"
  forbidden_write_paths:
    - "source_code"
    - "test_code"
    - "runtime_config"
approval:
  required_before_next_stage: true
  approved_by: "human"
entry_conditions:
  - "ARCH.md is approved by human."
  - "For L1/L2, SPEC.md and EVAL.md are approved by human."
  - "For L0, SPEC.md and EVAL.md may be absent when ARCH.md directs a single TODO-ALL."
exit_conditions:
  - "TODO.md splits work by construction boundary, dependency order, modification scope, and reviewability."
  - "Each TODO has allowed scope, forbidden scope, preservation requirements, steps, validation, evidence, and out-of-scope items."
  - "Each TODO can be executed in a fresh context."
  - "TODO count respects inherited complexity level."
hard_red_lines:
  - "Do not mechanically split by EVAL scenario."
  - "Do not invent files, classes, or functions."
  - "Do not include architecture redesign."
handoff_summary_required: true
